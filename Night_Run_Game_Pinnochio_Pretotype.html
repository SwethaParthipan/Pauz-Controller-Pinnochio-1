<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAUZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#30294d,#171526 60%,#10101a)}
body{height:100dvh;display:grid;place-items:center;padding:0}
.stage{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;perspective:1300px;touch-action:pan-y}
.controller{position:relative;width:min(98vw,1400px,calc(92dvh * 2.15));aspect-ratio:2.15/1;transform-style:preserve-3d;transform:rotateX(5deg) rotateY(-3deg);filter:drop-shadow(0 18px 18px #05040d99);flex:none}
.shell{position:absolute;inset:5% 1.5% 4%;border-radius:17%/30%;background:linear-gradient(145deg,#777092,#403955 25%,#29243e 70%,#1b192c);border:2px solid #9287b2;box-shadow:inset 0 5px 12px #ffffff28,inset 0 -14px 22px #090815a8,0 8px 0 #111020}
.grip{position:absolute;bottom:0;width:23%;height:43%;background:linear-gradient(145deg,#514968,#252039 75%);border:2px solid #756b94;border-radius:48% 48% 42% 42%;box-shadow:inset 0 5px 10px #ffffff1b,0 7px 0 #100f1c;z-index:-1}.grip.l{left:4%;transform:rotate(8deg) translateZ(-5px)}.grip.r{right:4%;transform:rotate(-8deg) translateZ(-5px)}
.shoulder{position:absolute;top:3%;width:25%;height:11%;border-radius:30px;background:linear-gradient(#a098bd,#49415f);border:1px solid #b4a9d2;box-shadow:0 4px 0 #171426}.shoulder.l{left:12%}.shoulder.r{right:12%}
.screen{position:absolute;left:50%;top:12%;transform:translateX(-50%) translateZ(9px);width:35%;height:44%;padding:5px;border-radius:17px;background:linear-gradient(145deg,#a99be9,#393052 35%,#171426);box-shadow:0 8px 20px #070611aa,inset 0 1px 3px #fff8}canvas{display:block;width:100%;height:100%;border-radius:11px}
.dpad{position:absolute;left:13%;top:35%;width:15%;height:34%;transform:translateZ(15px)}.dpad i{position:absolute;background:linear-gradient(145deg,#89829e,#39334f);border:1px solid #9c94b4;border-radius:13%;box-shadow:0 4px 0 #151323;width:33%;height:33%;display:grid;place-items:center;color:#eee6ff;font:700 clamp(10px,1.5vw,20px) Arial;text-shadow:0 1px 4px #30245f;user-select:none;touch-action:none;cursor:pointer}.dpad .up{left:33.5%;top:0}.dpad .down{left:33.5%;bottom:0}.dpad .left{left:0;top:33.5%}.dpad .right{right:0;top:33.5%}.dpad .mid{position:absolute;left:33.5%;top:33.5%;width:33%;height:33%;background:#29253e;border:0;display:block}
.stick{position:absolute;width:7.2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#625b7a,#201d32 70%);border:2px solid #8980a6;box-shadow:inset 0 5px 10px #0009,0 4px 0 #151323;transform:translateZ(17px)}.stick.l{left:35%;bottom:8%}.stick.r{right:35%;bottom:8%}.knob{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#b0a6cc,#49435f 60%,#29253b);border:1px solid #c0b6da;box-shadow:0 3px 5px #080713;display:flex;align-items:center;justify-content:center}.guide-symbol{font: bold clamp(11px,1.35vw,17px) Arial,sans-serif;color:#fff;text-shadow:0 1px 3px #211a35;line-height:1}.guide-symbol.question{font-size:clamp(15px,1.8vw,22px)}.book-mark{width:58%;height:58%;display:block;filter:drop-shadow(0 1px 2px #211a35)}.guide-trigger{cursor:pointer;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;touch-action:manipulation;user-select:none;outline:none}.guide-trigger:focus,.guide-trigger:focus-visible{outline:none;box-shadow:none}
.abxy{position:absolute;right:13%;top:35%;width:15%;height:34%;transform:translateZ(17px)}.abxy i{position:absolute;width:33%;height:33%;border-radius:50%;border:1px solid #c2b7f5;background:linear-gradient(145deg,#a093ed,#51458e);box-shadow:0 4px 0 #201b3b,0 0 10px #8e7bea44;display:grid;place-items:center;color:#fff;font:700 clamp(10px,1.5vw,20px) Arial;text-shadow:0 1px 4px #30245f;user-select:none;touch-action:none;cursor:pointer}.abxy i:active,.abxy i.pressed{filter:brightness(1.3);transform:scale(.94)}.abxy .y{left:33.5%;top:0}.abxy .x{left:0;top:33.5%}.abxy .b{right:0;top:33.5%}.abxy .a{left:33.5%;bottom:0}
@media(max-width:520px){.controller{width:min(98vw,calc(92dvh * 2.15))}.screen{border-radius:9px;padding:3px}}
</style></head><body><main class="stage" id="stage"><div class="controller" id="controller"><div class="grip l"></div><div class="grip r"></div><div class="shell"></div><div class="shoulder l"></div><div class="shoulder r"></div><div class="screen"><canvas id="game" width="640" height="360"></canvas></div><div class="dpad"><i class="up" data-key="triangle">△</i><i class="down">×</i><i class="left" data-key="square" aria-label="Square">□</i><i class="right">○</i><i class="mid"></i></div><div class="stick l guide-trigger" id="controlsGuideButton" role="button" aria-label="Controls guide"><div class="knob"><svg class="book-mark" viewBox="0 0 32 26" aria-hidden="true"><path d="M2 4.5 Q9 2 16 7 Q23 2 30 4.5 V22 Q23 20 16 24 Q9 20 2 22 Z" fill="rgba(184,160,238,.24)" stroke="#eee7ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 7 V24" fill="none" stroke="#eee7ff" stroke-width="1.8" stroke-linecap="round"/></svg></div></div><div class="stick r guide-trigger" id="howToPlayButton" role="button" aria-label="How to play"><div class="knob"><span class="guide-symbol question">?</span></div></div><div class="abxy"><i class="y" data-key="Y">Y</i><i class="x" data-key="X">X</i><i class="b" data-key="B">B</i><i class="a" data-key="A">A</i></div></div></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let start=0,elapsed=0,swapped=false,held=new Set(),frame=0,world=0,started=false;
let jumpVelocity=0,groundY=266,jumpsUsed=0,health=100,lastHit=-999,gameOver=false,showInstructions=false,helpMode='controls',pauseStarted=0,pausedTotal=0,interventionActive=false,interventionStarted=0,interventionUntil=0;
const obstacles=[{at:0,w:34,h:30},{at:300,w:52,h:66},{at:700,w:30,h:27}];
let nextObstacleAt=1000,obstaclePattern=0;
const stars=Array.from({length:75},(_,i)=>({x:i*83%640,y:i*47%360,r:i%3+1,s:.3+i%5*.12}));

function drawBookInline(before,after,y,font,size,gap=9){
 ctx.save();
 ctx.font=font;
 const beforeW=ctx.measureText(before).width;
 const afterW=ctx.measureText(after).width;
 const totalW=beforeW+gap+size+gap+afterW;
 let x=(640-totalW)/2;
 ctx.textAlign='left';ctx.textBaseline='middle';
 ctx.fillStyle='#ffffff';
 ctx.fillText(before,x,y);
 x+=beforeW+gap;
 drawBookIcon(x+size/2,y,size);
 x+=size+gap;
 ctx.fillText(after,x,y);
 ctx.restore();
}
function drawBookIcon(x,y,size){
 const w=size,h=size*.72;
 ctx.save();
 ctx.translate(x,y);
 ctx.strokeStyle='#ffffff';ctx.fillStyle='rgba(255,255,255,.08)';
 ctx.lineWidth=Math.max(2,size*.09);ctx.lineJoin='round';ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(-w*.48,-h*.42);ctx.quadraticCurveTo(-w*.18,-h*.52,0,-h*.28);
 ctx.quadraticCurveTo(w*.18,-h*.52,w*.48,-h*.42);
 ctx.lineTo(w*.48,h*.38);ctx.quadraticCurveTo(w*.18,h*.25,0,h*.48);
 ctx.quadraticCurveTo(-w*.18,h*.25,-w*.48,h*.38);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,-h*.28);ctx.lineTo(0,h*.47);ctx.stroke();
 ctx.restore();
}

const controls={
 square:document.querySelector('[data-key="square"]'),
 triangle:document.querySelector('[data-key="triangle"]'),
 B:document.querySelector('[data-key="B"]'),
 Y:document.querySelector('[data-key="Y"]')
};
function mapping(){
 // Before: Square=Jump, Triangle=Long Jump, B=Walk, Y=Run.
 // After 30 seconds: Square=Long Jump, Triangle=Run, B=Jump, Y=Walk.
 return swapped
  ? {square:'longJump',triangle:'run',B:'jump',Y:'walk'}
  : {square:'jump',triangle:'longJump',B:'walk',Y:'run'};
}
function actionFor(key){return mapping()[key]}
function doJump(doubleAllowed=false){
 if(jumpsUsed===0 || (doubleAllowed && jumpsUsed<2)){
  jumpVelocity=-8.2;jumpsUsed++;
 }
}
function doLongJump(){
 if(jumpsUsed===0){
  jumpVelocity=-12.2;
  jumpsUsed=1;
 }
}
function press(key,down){
 const btn=controls[key];if(btn)btn.classList.toggle('pressed',down);
 const was=held.has(key);
 if(down)held.add(key);else held.delete(key);
 if(down&&!was){const a=actionFor(key);if(a==='jump')doJump(false);if(a==='doubleJump')doJump(true);if(a==='longJump')doLongJump()}
}
function bind(btn,key){
 btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);press(key,true)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>press(key,false)));
}
Object.entries(controls).forEach(([key,btn])=>bind(btn,key));
function toggleGuide(mode){
 const now=performance.now();
 if(showInstructions && helpMode===mode){
  pausedTotal+=now-pauseStarted;
  showInstructions=false;
 }else if(!showInstructions){
  pauseStarted=now;
  showInstructions=true;
  helpMode=mode;
 }else{
  helpMode=mode;
 }
}
document.getElementById('controlsGuideButton').addEventListener('click',()=>toggleGuide('controls'));
document.getElementById('howToPlayButton').addEventListener('click',()=>toggleGuide('howto'));
const keyMap={q:'square',arrowup:'triangle',b:'B',y:'Y'};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),control=keyMap[k];if(control){e.preventDefault();if(!e.repeat)press(control,true)}});
window.addEventListener('keyup',e=>{const control=keyMap[e.key.toLowerCase()];if(control)press(control,false)});
function draw(now){
 elapsed=started?(now-start-pausedTotal-(showInstructions?now-pauseStarted:0)-(interventionActive?now-interventionStarted:0))/1000:0;
 if(!swapped&&elapsed>=30){
  swapped=true;held.clear();Object.values(controls).forEach(b=>b.classList.remove('pressed'));
  interventionActive=true;interventionStarted=now;interventionUntil=now+4200;
 } 
 if(interventionActive&&now>=interventionUntil){
  pausedTotal+=now-interventionStarted;
  interventionActive=false;
 }
 frame++;
 const map=mapping();let speed=0;
 for(const key of held){const a=map[key];if(a==='walk')speed=Math.max(speed,1.1);if(a==='run')speed=Math.max(speed,3.3)}
 if(!gameOver&&!showInstructions&&!interventionActive)world+=speed;
 if(!gameOver&&!showInstructions&&!interventionActive)jumpVelocity+=0.32;let playerY=(window.playerY??groundY)+jumpVelocity;
 if(playerY>=groundY){playerY=groundY;jumpVelocity=0;jumpsUsed=0}window.playerY=playerY;
 let g=ctx.createLinearGradient(0,0,0,360);g.addColorStop(0,'#17152e');g.addColorStop(1,'#29204b');ctx.fillStyle=g;ctx.fillRect(0,0,640,360);
 stars.forEach((p,i)=>{ctx.globalAlpha=.35+.55*Math.abs(Math.sin(frame*.025+i));ctx.fillStyle='#dcd5ff';ctx.beginPath();ctx.arc((p.x-frame*p.s+900)%640,p.y,p.r*.65,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 let pg=ctx.createRadialGradient(490,105,3,490,105,42);pg.addColorStop(0,'#d9bfff');pg.addColorStop(.35,'#8b70c9');pg.addColorStop(1,'#493b79');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(490,105,29,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#312553';ctx.beginPath();ctx.moveTo(0,270);ctx.lineTo(110,205);ctx.lineTo(220,270);ctx.lineTo(340,190);ctx.lineTo(470,275);ctx.lineTo(560,220);ctx.lineTo(640,270);ctx.lineTo(640,360);ctx.lineTo(0,360);ctx.fill();ctx.fillStyle='#211b3e';ctx.fillRect(0,290,640,70);
 // Continuous obstacle stream: each obstacle has its own world position.
 // New obstacles are added ahead as the player progresses; there is no short loop reset.
 function rock(x,y,w,h){ctx.save();ctx.fillStyle='#8f78c9';ctx.shadowColor='#a98cff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*.18,y-h*.72);ctx.lineTo(x+w*.72,y-h);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();ctx.restore()}
 // Keep only the original obstacle set; no new obstacles spawn mid-run.
 obstacles.forEach(o=>{
  const ox=620-((o.at+world*2.1)%900);
  if(ox>-65&&ox<680)rock(ox,290,o.w,o.h);
 });
 // Hitting a rock/crystal removes one quarter of the health bar.
 const playerX=125,playerFeet=playerY+23;
 const touching=obstacles.some(o=>{
  const ox=620-((o.at+world*2.1)%900);
  return playerX+13>ox&&playerX-13<ox+o.w&&playerFeet>290-o.h+5&&playerY<295;
 });
 if(!gameOver&&touching&&now-lastHit>1100){
  health=Math.max(0,health-25);lastHit=now;
  if(health===0){gameOver=true;held.clear()}
 }
 // A crow flies across the play area, flapping its wings.
 const crowX=650-((frame*2.2)%760), crowY=142+Math.sin(frame*.055)*24;
 ctx.save();ctx.translate(crowX,crowY);ctx.strokeStyle='#171326';ctx.fillStyle='#171326';ctx.lineWidth=5;ctx.lineCap='round';
 ctx.beginPath();ctx.ellipse(0,0,12,6,0,0,Math.PI*2);ctx.fill();
 const flap=Math.sin(frame*.22)*13;
 ctx.beginPath();ctx.moveTo(-3,0);ctx.quadraticCurveTo(-17,-14-flap,-27,-5-flap*.5);ctx.moveTo(3,0);ctx.quadraticCurveTo(16,-15+flap,27,-6+flap*.5);ctx.stroke();
 ctx.beginPath();ctx.moveTo(10,-1);ctx.lineTo(20,2);ctx.lineTo(10,4);ctx.fill();ctx.restore();
 let x=125,y=playerY;ctx.save();ctx.translate(x,y);ctx.shadowColor='#c4a7ff';ctx.shadowBlur=18;ctx.fillStyle='#e5d9ff';ctx.beginPath();ctx.arc(0,-28,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a58be7';ctx.fillRect(-9,-17,18,25);ctx.strokeStyle='#d8c9ff';ctx.lineWidth=6;ctx.lineCap='round';let sw=Math.sin(frame*.18)*9;ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(-10+sw,23);ctx.moveTo(5,7);ctx.lineTo(12-sw,23);ctx.moveTo(-8,-10);ctx.lineTo(-18-sw,-2);ctx.moveTo(8,-10);ctx.lineTo(18+sw,-3);ctx.stroke();ctx.restore();
 // Numeric elapsed timer only; no “Time” label.
 ctx.save();ctx.fillStyle='#ffe600';ctx.font='bold 22px Arial';ctx.shadowColor='#ffe600';ctx.shadowBlur=5;let sec=Math.floor(elapsed),mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');ctx.fillText(mm+':'+ss,24,42);ctx.restore();
 // Top-right health bar.
 ctx.save();
 ctx.fillStyle='#171326';ctx.globalAlpha=.82;ctx.beginPath();ctx.roundRect(490,20,126,24,10);ctx.fill();
 ctx.globalAlpha=1;ctx.fillStyle='#f1eaff';ctx.font='bold 13px Arial';ctx.fillText('♥',499,37);
 ctx.fillStyle='#514568';ctx.beginPath();ctx.roundRect(516,28,88,8,5);ctx.fill();
 ctx.fillStyle=health>50?'#a88cff':health>25?'#ffc66d':'#ff5d83';
 ctx.beginPath();ctx.roundRect(516,28,88*(health/100),8,5);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText(health+'%',576,17);
 ctx.restore();
 if(now-lastHit<450){ctx.fillStyle='rgba(255,70,110,.12)';ctx.fillRect(0,0,640,360)}
 if(!started&&!showInstructions){
  ctx.save();
  ctx.fillStyle='rgba(13,10,27,.97)';ctx.beginPath();ctx.roundRect(42,24,556,312,20);ctx.fill();
  ctx.strokeStyle='#b9a5f5';ctx.lineWidth=3;ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 34px Arial';
  ctx.fillText('NIGHT RUN',320,83);
  drawBookInline('Use','for controls',145,'bold 25px Arial',20,10);
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 25px Arial';
  ctx.fillText('Use the ? button for instructions',320,190);
  ctx.fillStyle='#ffffff';ctx.font='bold 22px Arial';
  ctx.fillText('PRESS ANYWHERE ON SCREEN',320,264);
  ctx.fillText('TO START',320,294);
  ctx.restore();
 }
 if(interventionActive){
  ctx.save();
  ctx.fillStyle='rgba(13,10,27,.96)';ctx.beginPath();ctx.roundRect(54,72,532,216,20);ctx.fill();
  ctx.strokeStyle='#b9a5f5';ctx.lineWidth=3;ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 31px Arial';
  ctx.fillText('INTERVENTION MODE!',320,125);
  ctx.fillStyle='#ffffff';ctx.font='bold 25px Arial';
  ctx.fillText('Your controls have changed.',320,169);
  drawBookInline('Use','to view your',216,'bold 25px Arial',19,9);
  ctx.textAlign='center';ctx.fillText('swapped controls.',320,245);
  ctx.restore();
 }
 if(showInstructions){
  const instructions = swapped
   ? [['□  SQUARE','LONG JUMP'],['△  TRIANGLE','RUN'],['B','JUMP'],['Y','WALK']]
   : [['□  SQUARE','JUMP'],['△  TRIANGLE','LONG JUMP'],['B','WALK'],['Y','RUN']];
  ctx.save();
  ctx.fillStyle='rgba(15,12,29,.97)';ctx.beginPath();ctx.roundRect(54,28,532,304,18);ctx.fill();
  ctx.strokeStyle='#b9a5f5';ctx.lineWidth=3;ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 29px Arial';
  if(helpMode==='controls'){
   ctx.fillText(swapped?'UPDATED CONTROLS':'GAME CONTROLS',320,83);
   instructions.forEach((item,i)=>{
    const yy=127+i*43;
    ctx.textAlign='left';ctx.fillStyle='#d5c8ff';ctx.font='bold 22px Arial';ctx.fillText(item[0],105,yy);
    ctx.textAlign='right';ctx.fillStyle='#ffffff';ctx.font='bold 22px Arial';ctx.fillText(item[1],535,yy);
   });
   drawBookInline('PRESS','BUTTON AGAIN TO CLOSE',309,'bold 19px Arial',17,8);
   ctx.textAlign='center';
  }else{
   ctx.fillText('HOW TO PLAY',320,83);
   const tips=[['MOVE','Use buttons to walk or run.'],['JUMP','Jump over rocks and obstacles.'],['HEALTH','Each hit removes 25% health.']];
   tips.forEach((item,i)=>{
    const yy=125+i*62;
    ctx.textAlign='left';ctx.fillStyle='#d5c8ff';ctx.font='bold 22px Arial';ctx.fillText(item[0],100,yy);
    ctx.fillStyle='#ffffff';ctx.font='20px Arial';ctx.fillText(item[1],100,yy+27);
   });
   ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 19px Arial';
   ctx.fillText('PRESS ? BUTTON AGAIN TO CLOSE',320,309);
  }
  ctx.restore();
 }
 if(gameOver){
  ctx.fillStyle='rgba(12,9,24,.76)';ctx.fillRect(0,0,640,360);
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.fillText('GAME OVER',320,165);
  ctx.font='16px Arial';ctx.fillStyle='#e1d5ff';ctx.fillText('Tap the game screen to restart',320,198);ctx.textAlign='left';
 }
 requestAnimationFrame(draw);
}
c.addEventListener('pointerdown',()=>{
 if(!started){
  started=true;start=performance.now();elapsed=0;pausedTotal=0;pauseStarted=0;
  return;
 }
 if(gameOver){
  health=100;lastHit=-999;gameOver=false;world=0;start=performance.now();elapsed=0;
  pausedTotal=0;pauseStarted=0;interventionActive=false;showInstructions=false;swapped=false;
  window.playerY=groundY;jumpVelocity=0;jumpsUsed=0;held.clear();
  obstacles.splice(0,obstacles.length,{at:0,w:34,h:30},{at:300,w:52,h:66},{at:700,w:30,h:27});
  nextObstacleAt=1000;obstaclePattern=0;
 }
});
requestAnimationFrame(draw);
</script></body></html>
